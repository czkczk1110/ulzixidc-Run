name: Ulzix Auto Signin

on:
  schedule:
    # UTC 17:00 = 北京时间(UTC+8) 次日 01:00
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install puppeteer-real-browser axios

    - name: Install Chinese Fonts and Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-zenhei fonts-wqy-microhei xfonts-wqy xvfb

    - name: Install Xray & VLESS to Socks5 10080
      env:
        VLESS_LINK: ${{ secrets.VLESS_LINK }}
      run: |
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -o xray.zip && chmod +x xray

        # 生成 Xray 配置（增强版解析器 vless2config.py：
        # 支持 reality / tls / ws / grpc / httpupgrade / xhttp / h2 / vision flow）
        python3 vless2config.py || exit 1

        ./xray -config config.json > xray.log 2>&1 &
        sleep 6

        # 验证代理可用性（用 gstatic generate_204，比 HEAD google.com 更可靠）
        code=$(curl -sS -o /dev/null -w "%{http_code}" --socks5-hostname 127.0.0.1:10080 \
              https://www.gstatic.com/generate_204 --connect-timeout 10 --max-time 20 || true)
        if [ "$code" != "204" ]; then
           echo "⚠️ 警告: 节点通过代理访问外网失败，请检查 VLESS_LINK 是否可用！(HTTP $code)"
           cat xray.log
           exit 1
        fi
        echo "🚀 节点代理测试成功！"

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Run Signin Script
      env:
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        node sign.js

    - name: Upload Screenshot Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signin-screenshots
        path: screenshots/
        retention-days: 7
