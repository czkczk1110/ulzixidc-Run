name: Ulzix Auto Signin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install puppeteer-core axios v2ray-url-decoder

    - name: Install Xray & VLESS to Socks5 10080
      env:
        VLESS_LINK: ${{ secrets.VLESS_LINK }}
      run: |
        # 下载并安装 Xray-core
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip xray.zip && chmod +x xray
        
        # 使用专业的 v2ray-url-decoder 解密并生成完整规范的 config.json
        node -e '
        const { v2rayUrlDecoder } = require("v2ray-url-decoder");
        const fs = require("fs");
        
        try {
            const link = process.env.VLESS_LINK;
            const result = v2rayUrlDecoder(link);
            
            // 构造出标准的 Xray 配置文件
            const config = {
                "log": { "loglevel": "warning" },
                "inbounds": [{
                    "port": 10080,
                    "protocol": "socks",
                    "settings": { "auth": "noauth", "udp": true }
                }],
                "outbounds": [
                    result.config
                ]
            };
            
            // 强行把本地出站的端口重置为标准的 socks5 接入
            config.outbounds[0].tag = "proxy";
            
            fs.writeFileSync("config.json", JSON.stringify(config, null, 4));
            console.log("专业解析成功：config.json 已生成");
        } catch (e) {
            console.error("解析 VLESS 失败:", e.message);
            process.exit(1);
        }
        '
        
        # 启动 Xray 测试网络
        ./xray -config config.json > xray.log 2>&1 &
        echo "等待代理隧道建立..."
        sleep 5
        
        # 测试节点是否通畅
        echo "测试节点可用性..."
        curl -I -s --socks5 127.0.0.1:10080 https://www.google.com | head -n 5 || true

    - name: Install and Setup CloakBrowser (Chrome-based)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # 启动 Chrome 并绑定代理
        google-chrome-stable \
          --headless=new \
          --no-sandbox \
          --remote-debugging-port=9222 \
          --proxy-server="socks5://127.0.0.1:10080" \
          --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" &
        
        sleep 5

    - name: Run Signin Script
      env:
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        node sign.js
