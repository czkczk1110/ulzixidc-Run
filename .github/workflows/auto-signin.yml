name: Ulzix Auto Signin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install puppeteer-core axios

    - name: Install Chinese Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-zenhei fonts-wqy-microhei xfonts-wqy

    - name: Install Xray & VLESS to Socks5 10080
      env:
        VLESS_LINK: ${{ secrets.VLESS_LINK }}
      run: |
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -o xray.zip && chmod +x xray
        
        python3 -c '
        import os, json, re
        from urllib.parse import urlparse, parse_qs
        
        try:
            link = os.environ.get("VLESS_LINK", "").strip()
            if not link.startswith("vless://"):
                raise ValueError("节点格式错误")
                
            pattern = re.compile(r"vless://(.*?)@(.*?):(\d+)(.*)")
            match = pattern.match(link)
            uuid, address, port, rest = match.groups()
            remain = urlparse("http://localhost" + rest.split("#")[0])
            params = parse_qs(remain.query)
            
            outbound = {
                "protocol": "vless",
                "settings": {
                    "vnext": [{
                        "address": address, "port": int(port),
                        "users": [{"id": uuid, "encryption": "none", "level": 0}]
                    }]
                },
                "streamSettings": {}
            }
            
            network = params.get("type", ["tcp"])[0]
            outbound["streamSettings"]["network"] = network
            if network == "ws":
                outbound["streamSettings"]["wsSettings"] = {"path": params.get("path", ["/"])[0]}
                if params.get("host"):
                    outbound["streamSettings"]["wsSettings"]["headers"] = {"Host": params.get("host")[0]}
            
            security = params.get("security", ["none"])[0]
            outbound["streamSettings"]["security"] = security
            if security == "tls":
                outbound["streamSettings"]["tlsSettings"] = {
                    "serverName": params.get("sni", [params.get("host", [address])[0]])[0]
                }
                
            config = {
                "log": {"loglevel": "warning"},
                "inbounds": [{
                    "port": 10080, "protocol": "socks",
                    "settings": {"auth": "noauth", "udp": True}, "listen": "127.0.0.1"
                }],
                "outbounds": [outbound]
            }
            with open("config.json", "w") as f:
                json.dump(config, f, indent=4)
            print("Xray 配置生成成功")
        except Exception as e:
            print(f"Xray 配置生成失败: {e}")
            exit(1)
        '
        
        ./xray -config config.json > xray.log 2>&1 &
        sleep 6
        
        # 验证代理可用性，如果失败打印日志
        if ! curl -I -s --socks5-hostname 127.0.0.1:10080 https://www.google.com --connect-timeout 10 | grep -q "HTTP/"; then
           echo "⚠️ 警告: 节点通过代理访问外网失败，请检查 VLESS_LINK 是否可用！"
           cat xray.log
        else
           echo "🚀 节点代理测试成功！"
        fi

    - name: Install and Setup CloakBrowser (Chrome-based)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # === 【核心修复】：注入完美的纯 Headless 环境防崩溃参数 ===
        google-chrome-stable \
          --headless=new \
          --no-sandbox \
          --disable-gpu \
          --disable-dev-shm-usage \
          --disable-software-rasterizer \
          --remote-debugging-port=9222 \
          --proxy-server="socks5://127.0.0.1:10080" \
          --lang=zh-CN \
          --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" > chrome.log 2>&1 &
        
        sleep 5
        cat chrome.log || true

    - name: Run Signin Script
      env:
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        node sign.js

    - name: Upload Screenshot Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signin-screenshots
        path: screenshots/
        retention-days: 7
