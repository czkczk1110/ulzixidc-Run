name: Ulzix Auto Signin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        # 移除了报错的第三方包，只保留最核心的两个
        npm install puppeteer-core axios

    - name: Install Xray & VLESS to Socks5 10080
      env:
        VLESS_LINK: ${{ secrets.VLESS_LINK }}
      run: |
        # 下载并安装 Xray-core
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip xray.zip && chmod +x xray
        
        # 使用 Node.js 原生标准库 URL 精准解析 vless 链接
        node -e '
        const fs = require("fs");
        try {
            const rawUrl = process.env.VLESS_LINK.trim();
            if (!rawUrl.startsWith("vless://")) {
                throw new Error("链接必须以 vless:// 开头");
            }
            
            // 解析标准 URL 格式
            const urlObj = new URL(rawUrl);
            const uuid = urlObj.username;
            const address = urlObj.hostname;
            const port = parseInt(urlObj.port);
            const searchParams = urlObj.searchParams;
            
            // 提取关键传输参数
            const network = searchParams.get("type") || "ws";
            const security = searchParams.get("security") || "none";
            const path = searchParams.get("path") || "/";
            const host = searchParams.get("host") || "";
            
            const outbound = {
                "protocol": "vless",
                "settings": {
                    "vnext": [{
                        "address": address,
                        "port": port,
                        "users": [{
                            "id": uuid,
                            "encryption": "none",
                            "level": 0
                        }]
                    }]
                },
                "streamSettings": {
                    "network": network,
                    "security": security
                }
            };
            
            // 根据协议类型补全设置
            if (network === "ws") {
                outbound.streamSettings.wsSettings = { "path": path };
                if (host) outbound.streamSettings.wsSettings.headers = { "Host": host };
            }
            if (security === "tls") {
                outbound.streamSettings.tlsSettings = {
                    "serverName": host || address,
                    "allowInsecure": true
                };
            }
            
            // 组合完整 config
            const config = {
                "log": { "loglevel": "warning" },
                "inbounds": [{
                    "port": 10080,
                    "protocol": "socks",
                    "settings": { "auth": "noauth", "udp": true }
                }],
                "outbounds": [outbound]
            };
            
            fs.writeFileSync("config.json", JSON.stringify(config, null, 4));
            console.log("原生解析成功：config.json 已安全生成");
        } catch (e) {
            console.error("解析 VLESS 错误:", e.message);
            process.exit(1);
        }
        '
        
        # 启动 Xray 测试网络
        ./xray -config config.json > xray.log 2>&1 &
        echo "等待代理隧道建立..."
        sleep 5
        
        # 测试节点是否通畅
        echo "测试节点可用性..."
        curl -I -s --socks5 127.0.0.1:10080 https://www.google.com | head -n 5 || true

    - name: Install and Setup CloakBrowser (Chrome-based)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # 启动 Chrome 并绑定代理
        google-chrome-stable \
          --headless=new \
          --no-sandbox \
          --remote-debugging-port=9222 \
          --proxy-server="socks5://127.0.0.1:10080" \
          --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" &
        
        sleep 5

    - name: Run Signin Script
      env:
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        node sign.js
