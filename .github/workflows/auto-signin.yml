name: Ulzix Auto Signin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install puppeteer-core axios

    - name: Install Xray & VLESS to Socks5 10080
      env:
        VLESS_LINK: ${{ secrets.VLESS_LINK }}
      run: |
        # 1. 下载并安装 Xray-core
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -o xray.zip && chmod +x xray
        
        # 2. 移除新版 Xray 不支持的旧参数，完美适配新架构
        python3 -c '
        import os, json, re
        from urllib.parse import urlparse, parse_qs
        
        try:
            link = os.environ.get("VLESS_LINK", "").strip()
            if not link.startswith("vless://"):
                raise ValueError("节点格式错误，必须以 vless:// 开头")
                
            pattern = re.compile(r"vless://(.*?)@(.*?):(\d+)(.*)")
            match = pattern.match(link)
            if not match:
                raise ValueError("无法切分 vless 链接结构")
                
            uuid, address, port, rest = match.groups()
            remain = urlparse("http://localhost" + rest.split("#")[0])
            params = parse_qs(remain.query)
            
            outbound = {
                "protocol": "vless",
                "settings": {
                    "vnext": [{
                        "address": address, "port": int(port),
                        "users": [{"id": uuid, "encryption": "none", "level": 0}]
                    }]
                },
                "streamSettings": {}
            }
            
            flow = params.get("flow", [""])[0]
            if flow:
                outbound["settings"]["vnext"][0]["users"][0]["flow"] = flow
                
            network = params.get("type", ["tcp"])[0]
            outbound["streamSettings"]["network"] = network
            
            if network == "ws":
                outbound["streamSettings"]["wsSettings"] = {"path": params.get("path", ["/"])[0]}
                if params.get("host"):
                    outbound["streamSettings"]["wsSettings"]["headers"] = {"Host": params.get("host")[0]}
            elif network == "grpc":
                outbound["streamSettings"]["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}
                
            security = params.get("security", ["none"])[0]
            outbound["streamSettings"]["security"] = security
            
            if security == "tls":
                # 新版 Xray-core 移除了 allowInsecure，直接声明标准的 serverName 即可
                outbound["streamSettings"]["tlsSettings"] = {
                    "serverName": params.get("sni", [params.get("host", [address])[0]])[0]
                }
            elif security == "reality":
                outbound["streamSettings"]["realitySettings"] = {
                    "serverName": params.get("sni", [address])[0],
                    "publicKey": params.get("pbk", [""])[0],
                    "shortId": params.get("sid", [""])[0],
                    "fingerprint": params.get("fp", ["chrome"])[0]
                }
                
            config = {
                "log": {"loglevel": "warning"},
                "inbounds": [{
                    "port": 10080, "protocol": "socks",
                    "settings": {"auth": "noauth", "udp": True}, "listen": "127.0.0.1"
                }],
                "outbounds": [outbound]
            }
            
            with open("config.json", "w") as f:
                json.dump(config, f, indent=4)
            print("=== [SUCCESS] Xray 配置文件完美生成 ===")
        except Exception as e:
            print(f"=== [ERROR] 解析失败: {e} ===")
            exit(1)
        '
        
        # 3. 后台启动 Xray
        ./xray -config config.json > xray.log 2>&1 &
        echo "正在等待代理建立安全隧道..."
        sleep 6
        
        # 4. 强力连通性阻断校验
        echo "开始检测代理有效性..."
        success=false
        for i in {1..3}; do
          if curl -I -s --socks5-hostname 127.0.0.1:10080 https://www.google.com --connect-timeout 6 | grep -q "HTTP/"; then
             echo "🚀 代理测试成功！节点完美畅通。"
             success=true
             break
          fi
          echo "第 $i 次重试节点连接中..."
          sleep 3
        done
        
        if [ "$success" = false ]; then
          echo "❌ 错误: 代理转换后网络仍不通！"
          echo "====== Xray 日志备份如下 ======"
          cat xray.log
          exit 1
        fi

    - name: Install and Setup CloakBrowser (Chrome-based)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        google-chrome-stable \
          --headless=new \
          --no-sandbox \
          --remote-debugging-port=9222 \
          --proxy-server="socks5://127.0.0.1:10080" \
          --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" &
        
        sleep 5

    - name: Run Signin Script
      env:
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        node sign.js
